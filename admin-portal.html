<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Portal - RouibiPOS</title>
    <link rel="stylesheet" href="enhanced-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: var(--background);
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }
        .admin-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.active { background: #dcfce7; color: #166534; }
        .badge.trial { background: #dbeafe; color: #1e40af; }
        .badge.expired { background: #fef08a; color: #854d0e; }
        .badge.suspended { background: #fee2e2; color: #991b1b; }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius);
        }
        
        #login-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: var(--radius-lg); width: 100%; max-width: 400px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div id="login-modal">
        <div class="modal-content">
            <h2 style="text-align: center; margin-bottom: 20px;">Super Admin Access</h2>
            <form id="admin-auth-form">
                <div class="form-group">
                    <label>Admin Key</label>
                    <input type="password" id="admin-key" required placeholder="Enter SUPER_ADMIN_KEY">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Authenticate</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <div class="admin-header">
            <div>
                <h1>Super Admin Portal</h1>
                <p>Manage SaaS Tenants and Licenses</p>
            </div>
            <div>
                <button class="btn btn-primary" onclick="toggleAddTenant()">+ New Tenant</button>
                <button class="btn btn-danger" onclick="logout()">Lock</button>
            </div>
        </div>

        <div class="admin-container">
            <!-- Add Tenant Form -->
            <div id="add-tenant-card" class="card hidden">
                <h2>Create New Tenant</h2>
                <form id="create-tenant-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Business Name</label>
                        <input type="text" id="t-name" required>
                    </div>
                    <div class="form-group">
                        <label>Tenant Slug (Store ID)</label>
                        <input type="text" id="t-slug" required pattern="[a-z0-9-]+" placeholder="lowercase-alphanumeric-hyphens">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="t-email" required>
                    </div>
                    <div class="form-group">
                        <label>Plan</label>
                        <select id="t-plan">
                            <option value="basic">Basic</option>
                            <option value="pro">Pro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Admin Username</label>
                        <input type="text" id="t-admin" required value="admin">
                    </div>
                    <div class="form-group">
                        <label>Admin Password</label>
                        <input type="text" id="t-pass" required>
                    </div>
                    <div style="grid-column: span 2;">
                        <button type="submit" class="btn btn-primary">Create Tenant & Provision DB</button>
                        <button type="button" class="btn" onclick="toggleAddTenant()">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Tenants List -->
            <div class="card">
                <h2>All Tenants</h2>
                <div class="table-responsive">
                    <table id="tenants-table">
                        <thead>
                            <tr>
                                <th>Name / Slug</th>
                                <th>Email</th>
                                <th>Plan</th>
                                <th>Status</th>
                                <th>Limits</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="admin-portal.js"></script>
</body>
</html>
