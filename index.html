<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional POS System</title>
    <link rel="stylesheet" href="enhanced-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="login-container">
            <div class="login-box">
                <h1 class="text-center" data-i18n="loginWelcome">Welcome to RouibiPOS</h1>
                <p class="text-center" style="margin-bottom: 20px; color: #666;">Enter your Store ID to continue</p>
                <form id="login-form">
                    <div class="form-group">
                        <label for="tenantSlug">Store ID (Tenant Slug)</label>
                        <input type="text" id="tenantSlug" required>
                    </div>
                    <div class="form-group">
                        <label for="username" data-i18n="username">Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password" data-i18n="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="login">Login</button>
                    <div id="login-error" class="login-error"></div>
                </form>
                <div style="text-align: center; margin-top: 20px; font-size: 14px;">
                    <p>Don't have a store? <a href="register.html">Register for a 30-day trial</a></p>
                </div>
            </div>
        </div>

        <!-- Content will be dynamically generated by JavaScript -->
        <div id="app-loading" class="loading-screen hidden">
            <div class="loading-spinner"></div>
            <h2>Loading Professional POS System...</h2>
            <p>Please wait while we initialize your system...</p>
        </div>
    </div>

    <script src="enhanced-script.js"></script>
</body>
</html>
